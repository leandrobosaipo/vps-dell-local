name: Validate Dell configuration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Static validation and scoped API refusal tests
        run: |
          python3 -B -m unittest discover -s cloudflare -p 'test_*.py'
          node --test migration/test_*.mjs
          python3 -m json.tool config/public-access.json >/dev/null
          for file in guest/*.sh; do bash -n "$file"; done
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --severity=warning guest/*.sh
      - name: Restore a large fictional snapshot on the observed Node 22 image
        run: |
          image='node:22.23.2-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85'
          docker pull "$image"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --memory 512m --cpus 1 --pids-limit 128 --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,src=$PWD,dst=/workspace,readonly" --workdir /workspace "$image" node --test --test-concurrency=1 migration/test_snapshot_scale.mjs maintenance/test_*.mjs
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Parse host scripts without Hyper-V effects
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem host -Filter '*.ps1' -File | ForEach-Object {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){throw ($errors.Message -join '; ')}
          }
          & ./host/Test-LabAccessFilter.ps1
          & ./host/Test-CapacityBudget.ps1
