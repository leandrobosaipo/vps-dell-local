global
    maxconn 32

defaults
    mode tcp
    timeout connect 8s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver local 127.0.0.11:53
    timeout resolve 3s
    hold valid 30s

frontend chatwoot_google
    bind 10.244.238.2:443
    tcp-request inspect-delay 4s
    acl hello req.ssl_hello_type 1
    acl token req.ssl_sni -i oauth2.googleapis.com
    acl profile req.ssl_sni -i www.googleapis.com
    tcp-request content reject if hello !token !profile
    tcp-request content accept if hello
    use_backend google_token if token
    use_backend google_profile if profile

backend google_token
    server google oauth2.googleapis.com:443 resolvers docker resolve-prefer ipv4 init-addr libc,none

backend google_profile
    server google www.googleapis.com:443 resolvers docker resolve-prefer ipv4 init-addr libc,none
